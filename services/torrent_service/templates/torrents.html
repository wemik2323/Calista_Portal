{% extends "base.html" %}

{% block title %}Торренты{% endblock %}

{% block header %}Торренты{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('torrent_service.static', filename='style.css') }}">
{% endblock %}

{% block content %}
<div class="torrent-wrap">
    <form id="search-form" class="search-form">
        <input id="search-input" class="search-input" type="text" placeholder="Поиск на Rutracker...">
        <button type="submit" class="search-btn">Найти</button>
    </form>

    <div id="results"></div>
    <div id="message" class="message"></div>
</div>

<script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const resultsBox = document.getElementById("results");
    const messageBox = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;

        resultsBox.innerHTML = "Поиск...";
        messageBox.textContent = "";
        messageBox.classList.remove("error");

        const res = await fetch(`/torrents/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (data.status !== "success") {
            resultsBox.innerHTML = data.message || "Ошибка";
            return;
        }

        if (!data.results.length) {
            resultsBox.innerHTML = "Ничего не найдено";
            return;
        }

        resultsBox.innerHTML = "";

        for (const item of data.results) {
            const card = document.createElement("div");
            card.className = "result-card";

            const title = document.createElement("div");
            title.className = "result-title";
            title.textContent = item.title;

            const meta = document.createElement("div");
            meta.className = "result-meta";
            meta.textContent =
                `${item.size} · Сиды: ${item.seeds} · Пиры: ${item.peers}`;

            const button = document.createElement("button");
            button.type = "button";
            button.className = "download-btn";
            button.textContent = "Скачать";

            button.addEventListener("click", () => {
                downloadTorrent(item.id);
            });

            card.appendChild(title);
            card.appendChild(meta);
            card.appendChild(button);

            resultsBox.appendChild(card);
        }
    });

    async function downloadTorrent(id) {
        const response = await fetch(
            "/torrents/api/download",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ id }),
            }
        );

        const data = await response.json();

        // здесь твоя текущая обработка ответа
    }
</script>
{% endblock %}
