name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Deploy Calista
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CALISTA_HOST }}
          username: calista-deploy
          key: ${{ secrets.CALISTA_DEPLOY_KEY }}
          port: ${{ secrets.CALISTA_SSH_PORT }}
          source: "."
          target: "/opt/calista/portal"
