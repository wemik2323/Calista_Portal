name: CD

on:
  workflow_dispatch:

jobs:
  test-connection:

    runs-on: ubuntu-latest

    steps:

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ CALISTA_HOST }}
          username: calista-deploy
          key: ${{ secrets.CALISTA_DEPLOY_KEY }}
          port: 32228
          script: |
            whoami
            pwd
